apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch-processing
  namespace: cao
  labels:
    carbon-aware.io/managed: "true"
    carbon-aware.io/deployment: batch-processing
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: batch-processing}
  template:
    metadata:
      labels:
        app: batch-processing
        carbon-aware.io/managed: "true"
        carbon-aware.io/deployment: batch-processing
      annotations:
        carbon-aware.io/kind: batch-processing
        carbon-aware.io/power-kw: "0.1"
        carbon-aware.io/state-gb: "0.5"
        carbon-aware.io/remaining-h: "1"
        carbon-aware.io/deadline: "2026-12-31T23:59:59Z"
        carbon-aware.io/preemptible: "true"
    spec:
      terminationGracePeriodSeconds: 300
      nodeSelector:
        topology.carbon-aware.io/region: us-east
      containers:
        - name: process
          image: cao/batch:dev
          imagePullPolicy: IfNotPresent
          env:
            - {name: JOB_NAME, value: batch-processing}
            - {name: STATE_MB, value: "500"}
            - {name: TOTAL_STEPS, value: "3600"}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          resources:
            requests: {cpu: "500m", memory: "1Gi"}
          volumeMounts:
            - {name: checkpoints, mountPath: /checkpoints}
      volumes:
        - name: checkpoints
          hostPath: {path: /checkpoints, type: DirectoryOrCreate}
