apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-training
  namespace: cao
  labels:
    carbon-aware.io/managed: "true"
    carbon-aware.io/deployment: ml-training
spec:
  replicas: 1
  strategy:
    type: Recreate                      # old pod checkpoints on SIGTERM before the new one starts
  selector:
    matchLabels: {app: ml-training}
  template:
    metadata:
      labels:
        app: ml-training
        carbon-aware.io/managed: "true"
        carbon-aware.io/deployment: ml-training
      annotations:
        carbon-aware.io/kind: ml-training
        carbon-aware.io/power-kw: "0.2"
        carbon-aware.io/state-gb: "0.2"
        carbon-aware.io/remaining-h: "2"
        carbon-aware.io/preemptible: "true"
        carbon-aware.io/cpu: "2"
    spec:
      terminationGracePeriodSeconds: 300  # >= checkpoint time for state-gb
      nodeSelector:
        topology.carbon-aware.io/region: india
      containers:
        - name: train
          image: cao/ml-training:dev
          imagePullPolicy: IfNotPresent
          env:
            - {name: JOB_NAME, value: ml-training}
            - {name: STATE_MB, value: "200"}
            - {name: TOTAL_STEPS, value: "7200"}
            - {name: STEP_SECONDS, value: "1"}
            - {name: CHECKPOINT_EVERY, value: "60"}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          resources:
            requests: {cpu: "1", memory: "512Mi"}
          volumeMounts:
            - {name: checkpoints, mountPath: /checkpoints}
      volumes:
        - name: checkpoints
          hostPath: {path: /checkpoints, type: DirectoryOrCreate}
