apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-service
  namespace: cao
  labels:
    carbon-aware.io/managed: "true"
    carbon-aware.io/deployment: web-service
spec:
  replicas: 1
  selector:
    matchLabels: {app: web-service}
  template:
    metadata:
      labels:
        app: web-service
        carbon-aware.io/managed: "true"
        carbon-aware.io/deployment: web-service
      annotations:
        carbon-aware.io/kind: web-service
        carbon-aware.io/power-kw: "0.05"
        carbon-aware.io/state-gb: "0.1"
        carbon-aware.io/user-region: india
        carbon-aware.io/sla-rtt-ms: "50"
        carbon-aware.io/preemptible: "false"
    spec:
      nodeSelector:
        topology.carbon-aware.io/region: india
      containers:
        - name: web
          image: cao/web-service:dev
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - {name: REGION, value: india}   # keep in sync with nodeSelector (controller patches both)
          readinessProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: cao
spec:
  selector: {app: web-service}
  ports: [{port: 80, targetPort: 8080}]
