apiVersion: v1
kind: ServiceAccount
metadata: {name: cao-controller, namespace: cao}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: cao-controller}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: cao-controller}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cao-controller}
subjects:
  - {kind: ServiceAccount, name: cao-controller, namespace: cao}
